# Oracle migration ORA-00942 lab — one Oracle Database Free container (currently 26ai).
# Companion to the post on ORA-00942 after a schema-mode Data Pump migration.
#
# FREEPDB1 is the source; the lab creates a second PDB, TARGET, as the new database. A schema-mode export of APP
# is imported into TARGET, and the lab shows which reads fail with ORA-00942 afterwards, why, and how to carry over
# what schema mode leaves behind. Deterministic; everything runs via docker exec.
services:
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: ora-migration-ora-00942-lab
    environment:
      ORACLE_PASSWORD: Lab_Passw0rd1
    ports:
      - "${LAB_PORT:-1521}:1521"
    volumes:
      - ora-migration-ora-00942-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

volumes:
  ora-migration-ora-00942-data:
