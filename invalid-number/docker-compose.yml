# Oracle ORA-01722 lab — one Oracle Database Free container (currently 26ai).
# Companion to the post on ORA-01722 (invalid number) that appears when the plan changes, not the data.
#
# APP.READINGS keeps numbers and text in one VARCHAR2 column. The lab shows the same query working and failing
# depending only on the plan, why, and the fixes that don't depend on evaluation order. Deterministic; everything
# runs via docker exec.
services:
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: ora-invalid-number-lab
    environment:
      ORACLE_PASSWORD: Lab_Passw0rd1
    ports:
      - "${LAB_PORT:-1521}:1521"
    volumes:
      - ora-invalid-number-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

volumes:
  ora-invalid-number-data:
